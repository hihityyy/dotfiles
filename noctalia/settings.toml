logging_out = "sh -c \"stop.sh\""
rebooting = "sh -c \"stop.sh\""
shutting_down = "sh -c \"stop.sh\""
theme_mode_changed = "systemctl --user restart xdg-desktop-portal xdg-desktop-portal-gnome"
wallpaper_changed = "systemctl --user restart xdg-desktop-portal xdg-desktop-portal-gnome"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[keybinds]
