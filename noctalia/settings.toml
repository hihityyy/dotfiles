[plugins]
enabled = [
    "noctalia/timer",
    "noctalia/notes",
    "kenn/keybind-cheatsheet",
    "imjustdoingmypart/niri-animations",
    "noctalia/translator",
    "radimous/prismlauncher-instances",
    "yocraft/custom-shortcut"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "~/.local/state/noctalia/plugins/materialized/custom"
    name = "custom"

[shell]
app_icon_color = "primary"
font_family = "Adwaita Sans"
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
popup_shadows = false
screen_time_enabled = true
show_location = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    auto_paste = "ctrl_v"
    categories = false

        [shell.launcher.dmenu.entry.keybinds]
        command = "printf 'Open	Show keybind cheatsheet'"
        exec = "noctalia msg panel-open kenn/keybind-cheatsheet:cheatsheet"
        global = false
        glyph = "keyboard"
        label = "Keybind Cheatsheet"
        prefix = "keys"

        [shell.launcher.dmenu.entry.obs]
        command = """printf 'Toggle Recording	Start or stop recording
Toggle Replay Buffer	Start/stop replay buffer
Save Replay	Save replay buffer to file
'"""
        exec = "case \"{selection}\" in \"Toggle Recording\"*) obs-status.sh -recording ;; \"Toggle Replay Buffer\"*) obs-status.sh -buffer ;; \"Save Replay\"*) obs-status.sh -replay ;; esac"
        global = false
        glyph = "video"
        label = "OBS"
        prefix = "rec"

        [shell.launcher.dmenu.entry.warp]
        command = """printf 'Connect	Connect to WARP
Disconnect	Disconnect from WARP
Status	Show connection status
'"""
        exec = "case \"{selection}\" in \"Connect\"*) warp-cli connect && sleep 1 && notify-send 'WARP' \"$(warp-cli status)\" || notify-send 'WARP' 'Failed to connect' ;; \"Disconnect\"*) warp-cli disconnect && sleep 1 && notify-send 'WARP' \"$(warp-cli status)\" || notify-send 'WARP' 'Failed to disconnect' ;; \"Status\"*) notify-send 'WARP Status' \"$(warp-cli status)\" ;; esac"
        global = false
        glyph = "shield"
        label = "Cloudflare WARP"
        prefix = "warp"

        [shell.launcher.providers.calculator]
        prefix = ""

        [shell.launcher.providers.emoji]
        prefix = ""

        [shell.launcher.providers.session]
        prefix = ""

        [shell.launcher.providers.wallpaper]
        prefix = ""

        [shell.launcher.providers.windows]
        prefix = ""

    [shell.panel]
    clipboard_placement = "attached"
    control_center_position = "center"
    list_item_background = true
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    polkit_placement = "attached"
    shadow = false
    wallpaper_position = "center"

    [shell.screen_corners]
    size = 12

    [shell.screenshot]
    confirm_region = true
    directory = "/home/hihity/media/pictures/screenshots"
    filename_pattern = "%Y-%m-%d_%H-%M-%S"
    show_cursor = true

    [shell.session]
    show_shortcuts = false

    [shell.shadow]
    direction = "down_left"

